name: Build Armbian Images
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # ubuntu-24.04-arm, ubuntu-24.04-riscv
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        board:
          # - "orangepi5-max"
          # - "orangepi5-plus"
          # - "orangepi5-ultra"
          - "orangepi5"
          # - "orangepi5b"
          # - "orangepi5pro"
          # - "rock-5c"
    env:
      ARMBIAN_ARTIFACTS: ${{ github.workspace }}/build/output/images/
    steps:
      - uses: armbian/build@main
        id: build
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: ${{ matrix.board }} # orangepi5 bananapif3
          armbian_release: "trixie" # trixie
          armbian_target: "build"
          armbian_artifacts: ${{ env.ARMBIAN_ARTIFACTS }}
          # armbian_release_tag: ${{ env.ARMBIAN_VERSION }}_${{ github.ref_name }}
          armbian_kernel_branch: "vendor"
          armbian_ui: "minimal" # server xfce
          armbian_runner_clean: "yes" # recommended for Github runners
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: steps.build.outcome == 'failure'
        with:
          archive: false
          path: ${{ env.ARMBIAN_ARTIFACTS }}/*.img.xz
          if-no-files-found: error
          retention-days: 7